name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  nix-check:
    strategy:
      matrix:
        os:
          - ubuntu-latest       #x86_64
          - ubuntu-26.04-arm  #arm64
    
    runs-on: ${{ matrix.os }}

    name: nix build / nix run (x86_64-linux)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # ubuntu-latest (24.04) restricts unprivileged user namespaces via
      # AppArmor by default, which breaks bubblewrap (used by buildFHSEnv).
      # See: https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
      - name: Allow unprivileged user namespaces (needed for bubblewrap/FHS env)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0


      - name: nix build
        run: nix build .#default --print-build-logs

      - name: nix run
        run: nix run .#default -- --version